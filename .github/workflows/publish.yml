name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"
          # Writes .npmrc with //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}.
          # Without registry-url there is no .npmrc, so NODE_AUTH_TOKEN is never
          # read and `npm publish` fails ENEEDAUTH (v1.0.2 run).
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build --if-present

      # Pre-flight the registry manifest BEFORE the npm publish. The registry
      # rejected v1.0.1 with 422 "expected length <= 100" on description, and
      # because npm publishes first that would have left a version on npm with
      # no registry entry. Fail here instead.
      - name: Validate the registry manifest
        run: |
          set -e
          DESC_LEN=$(jq -r '.description | length' server.json)
          if [ "$DESC_LEN" -gt 100 ]; then
            echo "server.json description is $DESC_LEN characters; the registry caps it at 100"
            exit 1
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json is $PKG_VERSION but the tag is $TAG_VERSION"
            exit 1
          fi

      # Publish only when THIS version is missing from npm. The previous guard
      # (`npm view . version`) was truthy for any published version, so every
      # release after 1.0.0 skipped the npm publish in silence.
      - name: Publish package to npm (if version is new)
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          if npm view "govcontractscout-mcp@$LOCAL" version >/dev/null 2>&1; then
            echo "govcontractscout-mcp@$LOCAL is already on npm, skipping publish"
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github --token ${{ secrets.MCP_GITHUB_TOKEN }}

      - name: Sync server.json version from tag
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
